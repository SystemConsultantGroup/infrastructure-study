apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-backend
  template:
    metadata:
      labels:
        app: team-backend
    spec:
      containers:
        - name: backend
          image: team-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_ROLE
              value: backend
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
